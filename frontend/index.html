<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — City Pizzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="login">
    <div class="login__marca">
      <img src="assets/logo-city-pizzas.png" alt="City Pizzas" style="height:48px; width:auto;" />
      <span>City Pizzas</span>
    </div>

    <div class="login__cartao">
      <div class="login__avatar">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <rect width="80" height="80" fill="#E9E9E9"/>
          <circle cx="40" cy="30" r="14" fill="#B9B9B9"/>
          <path d="M12 78c0-16 12-26 28-26s28 10 28 26" fill="#B9B9B9"/>
        </svg>
      </div>

      <div id="mensagemErro" class="mensagem mensagem--erro" role="alert"></div>
      <div id="mensagemInfo" class="mensagem mensagem--sucesso" role="status"></div>

      <!-- Login -->
      <form id="formLogin" novalidate>
        <div class="campo campo-com-icone">
          <div style="position:relative;">
            <svg viewBox="0 0 24 24" fill="#1A1A1A" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.7-9 6v2h18v-2c0-3.3-4-6-9-6z"/>
            </svg>
            <input type="text" id="usuario" name="usuario" placeholder="Usuário (matrícula)" autocomplete="username" required />
          </div>
          <span class="campo__erro" id="erroUsuario">Informe sua matrícula.</span>
        </div>

        <div class="campo campo-com-icone">
          <div style="position:relative;">
            <svg viewBox="0 0 24 24" fill="#1A1A1A" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 10V8a6 6 0 1112 0v2h1a1 1 0 011 1v10a1 1 0 01-1 1H5a1 1 0 01-1-1V11a1 1 0 011-1h1zm2 0h8V8a4 4 0 00-8 0v2z"/>
            </svg>
            <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required />
          </div>
          <span class="campo__erro" id="erroSenha">Informe sua senha.</span>
        </div>

        <a href="#" class="login__esqueci" id="linkEsqueciSenha">Esqueci a senha.</a>

        <button type="submit" class="botao botao--preto botao--largura-total" id="botaoEntrar">
          Entrar
        </button>
      </form>

      <!-- Recuperação de senha (2 etapas: e-mail -> código + nova senha) -->
      <form id="formRecuperar" novalidate style="display:none;">
        <div class="campo">
          <label for="emailRecuperacao">E-mail do colaborador</label>
          <input type="email" id="emailRecuperacao" autocomplete="email" />
        </div>

        <div id="etapaCodigo" style="display:none;">
          <div class="campo">
            <label for="codigoRecuperacao">Código de recuperação</label>
            <input type="text" id="codigoRecuperacao" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
          </div>
          <div class="campo">
            <label for="novaSenha">Nova senha</label>
            <input type="password" id="novaSenha" autocomplete="new-password" />
          </div>
        </div>

        <button type="submit" class="botao botao--preto botao--largura-total" id="botaoRecuperar">
          Enviar código
        </button>
        <p class="login__rodape"><a href="#" id="linkVoltarLogin">Voltar para o login</a></p>
      </form>

      <p class="login__rodape">
        Não tenho cadastro. <a href="cadastros.html">Cadastrar</a>
      </p>

      <!-- TEMPORÁRIO: remover quando o time não precisar mais navegar sem o back-end rodando -->
      <p class="login__rodape">
        <a href="#" id="linkModoTeste" style="color:#4A4A4A;">Entrar em modo de teste (sem back-end)</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
